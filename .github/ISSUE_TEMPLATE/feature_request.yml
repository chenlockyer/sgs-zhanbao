name: 功能请求
description: 想加能力 / 想改现有行为
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前建议先看 [docs/自动化边界.md](../../blob/main/docs/自动化边界.md)：
        有些「看起来该自动化的事」是实测过、明确放弃的，理由写在文档里。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 别写「希望支持 xxx」，写「我每次都得手动 xxx，很烦」。
      placeholder: 我每天要跑两场比赛，第二场的比分老忘记填，出完图才发现是 inferred。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你打算怎么用
      description: 期望的命令 / 参数 / 产物长什么样，越具体越好。
      placeholder: |
        sgs-zhanbao run --transcript a.txt --transcript b.txt   # 支持多份稿子
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过别的办法吗
      description: 现在绕过它的做法是什么，代价在哪。

  - type: dropdown
    id: scope
    attributes:
      label: 落在哪一层
      description: 不确定就选「不知道」，我来判断。
      options:
        - 校对（术语表 / 提示词 / 置信度策略）
        - 提取（字段 / 篇幅 / 结构）
        - 渲染（版式 / 配色 / 字体 / 尺寸）
        - 素材（build_art / 默认素材）
        - 采集（录音 / 转写 / 直播间）
        - 工程（打包 / 测试 / CI / 文档）
        - 不知道
    validations:
      required: true

  - type: checkboxes
    id: willing
    attributes:
      label: 其他
      options:
        - label: 我愿意提 PR（可以先聊聊实现思路）
        - label: 这个改动可能影响现有产物，我需要你评估兼容性
