name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest 已升到 26.04，官方工具链不再提供 3.9；
          # 所以 3.9 只在 windows-latest 上验证。
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # art extra 提供 Pillow + numpy：素材约束测试和渲染测试都要读图
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,render,art]"

      - name: Install chromium (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install chromium (Windows / macOS)
        if: runner.os != 'Linux'
        run: python -m playwright install chromium

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        run: pytest -q

      # 渲染链路不碰 LLM，所以 CI 里没有密钥也能跑通
      - name: Smoke render with bundled example
        run: python -m sgs_zhanbao render --data examples/sample_report.json --out output/ci.png

      - name: Doctor (no key in CI, so non-zero is expected)
        if: always()
        run: python -m sgs_zhanbao doctor
        continue-on-error: true

      - name: Upload example render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-render-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            output/ci.png
            output/ci.html
          if-no-files-found: ignore

  # 素材约束必须成立：接缝 0 色差 + mid 列内恒定 + 自带素材与脚本输出一致
  art-contract:
    name: 版式素材约束
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,art]"
      - name: Art tests（接缝 0 色差 + mid 列内恒定）
        run: pytest tests/test_build_art.py -v
