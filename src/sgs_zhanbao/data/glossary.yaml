# ---------------------------------------------------------------- 玩梗 / 黑话（必须保留）
memes:
  曹敢三: "梗，指曹纯敢叫三倍分。转写常错成「曹感三」「曹敢散」，要还原并把「敢」保留。"
  路边一条: "解说对弱将被碾压的戏称，转写「路边一条」正确。"
  开机猴: "开机大队的戏称，正式队名用「开机大队」。"
  紫石灯花: "战队名，转写常错成「紫石邓华」「子时灯花」。"
  田师傅: "对选手的称呼，非武将名。"
  北落老师: "知北落的昵称。"
  冠师傅: "对武将/装备的口语称呼，结合上下文判断。"
  万师傅: "「万箭齐发」的口语简称。"
  丈八: "丈八蛇矛的口语简称。"
  双酒杀: "两次酒杀的连招说法。"
  开大: "发动武将觉醒/限定技。"
  白给: "无谓损失手牌或血量。"

# ---------------------------------------------------------------- 赛事常识
format_notes:
  - "斗地主模式：地主 1 人 vs 农民 2 人，叫分 1/2/3/4 分决定当局赌注。"
  - "SGL 赛制常见「抢分制」，如 12 局抢 20 分；先到目标分数即结束。"
  - "叫分策略是战报的重要分析点：3 分上、反叫 4 分都是常见战术。"
  - "比分写作「A队 X : Y B队」，X 为 A 队得分。"
